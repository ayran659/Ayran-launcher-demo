name: Build Ayran Launcher

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Extract Ayran Launcher
        run: |
          mkdir source
          unzip -q AyranLauncher_Original_Ozgun_Arm64.zip -d source

      - name: Get JRE 17 and 21
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre17-21
          workflow_conclusion: completed
          name: jre17-pojav
          path: source/app_pojavlauncher/src/main/assets/components/jre-new

      - name: Get JRE 21
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre17-21
          workflow_conclusion: completed
          name: jre21-pojav
          path: source/app_pojavlauncher/src/main/assets/components/jre-21

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build launcher
        run: |
          PROJECT_DIR=$(dirname "$(find source -name gradlew -type f | head -1)")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew :jre_lwjgl3glfw:build --no-daemon
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with
