name: Build Ayran Launcher

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # AMETHYST KAYNAĞINI SUBMODULE'LAR OLMADAN İNDİR
      - name: Clone Amethyst
        run: |
          git clone \
            --depth 1 \
            --branch v3_openjdk \
            --no-recurse-submodules \
            https://github.com/AngelAuraMC/Amethyst-Android.git source

          cd source

          # SSH submodule adresini HTTPS'e çevir
          sed -i \
            's#git@github.com:alexytomi/androidnsbypass.git#https://github.com/alexytomi/androidnsbypass.git#g' \
            .gitmodules

          # Diğer olası SSH GitHub adreslerini de HTTPS yap
          sed -i \
            's#git@github.com:#https://github.com/#g' \
            .gitmodules

          git submodule sync --recursive

          git submodule update --init --depth 1

      # LTW
      - name: Download LTW
        run: |
          mkdir -p source/app_pojavlauncher/libs

          curl -fL --retry 5 --retry-delay 2 \
            -o source/app_pojavlauncher/libs/ltw-release.aar \
            https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar

      # JRE 17
      - name: Download JRE 17 ARM64
        run: |
          mkdir -p source/app_pojavlauncher/src/main/assets/components/jre-new

          curl -fL --retry 5 --retry-delay 2 \
            -o jre17.tar.xz \
            https://github.com/AngelAuraMC/angelauramc-openjdk-build/releases/download/release/jre17-android-arm64.tar.xz

          tar -xJf jre17.tar.xz \
            -C source/app_pojavlauncher/src/main/assets/components/jre-new

          rm -f jre17.tar.xz

      # JRE 21
      - name: Download JRE 21 ARM64
        run: |
          mkdir -p source/app_pojavlauncher/src/main/assets/components/jre-21

          curl -fL --retry 5 --retry-delay 2 \
            -o jre21.tar.xz \
            https://github.com/AngelAuraMC/angelauramc-openjdk-build/releases/download/release/jre21-android-arm64.tar.xz

          tar -xJf jre21.tar.xz \
            -C source/app_pojavlauncher/src/main/assets/components/jre-21

          rm -f jre21.tar.xz

      # JRE 25
      - name: Download JRE 25 ARM64
        run: |
          mkdir -p source/app_pojavlauncher/src/main/assets/components/jre-25

          curl -fL --retry 5 --retry-delay 2 \
            -o jre25.tar.xz \
            https://github.com/AngelAuraMC/angelauramc-openjdk-build/releases/download/release/jre25-android-arm64.tar.xz

          tar -xJf jre25.tar.xz \
            -C source/app_pojavlauncher/src/main/assets/components/jre-25

          rm -f jre25.tar.xz

      # Java 21
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Dil listesi
      - name: Generate language list
        working-directory: source
        run: |
          chmod +x scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh

      # LWJGL
      - name: Build LWJGL
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew :jre_lwjgl3glfw:build --no-daemon

      # Launcher
      - name: Build Ayran Launcher
        working-directory: source
        run: |
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon

      # APK
      - name: Prepare APK
        run: |
          mkdir -p output

          APK=$(find source/app_pojavlauncher/build/outputs/apk/debug \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK BULUNAMADI!"
            exit 1
          fi

          cp "$APK" output/Ayran-Launcher-debug.apk

          ls -lh output/Ayran-Launcher-debug.apk

      # APK'yı yükle
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AyranLauncher-APK
          path: output/Ayran-Launcher-debug.apk
          if-no-files-found: error
