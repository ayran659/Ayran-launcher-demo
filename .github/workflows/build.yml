name: Build Ayran Launcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # 1 - Ayran Launcher reposunu al
      # =========================================================
      - name: Checkout Ayran repository
        uses: actions/checkout@v4

      # =========================================================
      # 2 - Amethyst kaynak kodunu indir
      # SSH SUBMODULE HATASINI ENGELLER
      # =========================================================
      - name: Download Amethyst source
        run: |
          git clone \
            --depth 1 \
            --branch v3_openjdk \
            --no-recurse-submodules \
            https://github.com/AngelAuraMC/Amethyst-Android.git source

          cd source

          # SSH GitHub adreslerini HTTPS'e çevir
          sed -i \
            's#git@github.com:#https://github.com/#g' \
            .gitmodules

          sed -i \
            's#ssh://git@github.com/#https://github.com/#g' \
            .gitmodules

          git submodule sync --recursive

          git submodule update --init --depth 1

      # =========================================================
      # 3 - LTW
      # =========================================================
      - name: Download LTW
        run: |
          mkdir -p source/app_pojavlauncher/libs

          curl -fL --retry 5 --retry-delay 2 \
            https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar \
            -o source/app_pojavlauncher/libs/ltw-release.aar

          test -s source/app_pojavlauncher/libs/ltw-release.aar

      # =========================================================
      # 4 - JRE indirme yardımcı fonksiyonu
      # GitHub API gerçek asset URL'sini buluyor.
      # =========================================================
      - name: Prepare JRE downloader
        run: |
          cat > /tmp/download_jre.sh <<'SCRIPT'
          #!/bin/bash
          set -e

          REPO="$1"
          TAG="$2"
          ASSET="$3"
          DEST="$4"

          mkdir -p "$DEST"

          echo "JRE aranıyor:"
          echo "$REPO / $TAG / $ASSET"

          API="https://api.github.com/repos/${REPO}/releases/tags/${TAG}"

          URL=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "$API" \
            | jq -r --arg ASSET "$ASSET" \
              '.assets[] | select(.name == $ASSET) | .browser_download_url' \
            | head -n 1)

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "JRE ASSET BULUNAMADI!"
            echo "Repository: $REPO"
            echo "Tag: $TAG"
            echo "Asset: $ASSET"
            exit 1
          fi

          echo "Bulunan URL:"
          echo "$URL"

          curl -fL --retry 5 --retry-delay 3 \
            "$URL" \
            -o /tmp/jre.tar.xz

          test -s /tmp/jre.tar.xz

          tar -xJf /tmp/jre.tar.xz -C "$DEST"

          rm -f /tmp/jre.tar.xz

          echo "JRE tamamlandı."
          SCRIPT

          chmod +x /tmp/download_jre.sh

      # =========================================================
      # 5 - JRE 8
      # Eski Minecraft sürümleri için
      # =========================================================
      - name: Download JRE 8 ARM64
        run: |
          /tmp/download_jre.sh \
            AngelAuraMC/angelauramc-openjdk-build \
            download_jre8 \
            jre8-android-arm64.tar.xz \
            source/app_pojavlauncher/src/main/assets/components/jre

      # =========================================================
      # 6 - JRE 17
      # =========================================================
      - name: Download JRE 17 ARM64
        run: |
          /tmp/download_jre.sh \
            AngelAuraMC/angelauramc-openjdk-build \
            download_jre17 \
            jre17-android-arm64.tar.xz \
            source/app_pojavlauncher/src/main/assets/components/jre-new

      # =========================================================
      # 7 - JRE 21
      # =========================================================
      - name: Download JRE 21 ARM64
        run: |
          /tmp/download_jre.sh \
            AngelAuraMC/angelauramc-openjdk-build \
            download_jre21 \
            jre21-android-arm64.tar.xz \
            source/app_pojavlauncher/src/main/assets/components/jre-21

      # =========================================================
      # 8 - JRE 25
      # =========================================================
      - name: Download JRE 25 ARM64
        run: |
          /tmp/download_jre.sh \
            AngelAuraMC/angelauramc-openjdk-build \
            download_jre25 \
            jre25-android-arm64.tar.xz \
            source/app_pojavlauncher/src/main/assets/components/jre-25

      # =========================================================
      # 9 - Java 21
      # =========================================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # =========================================================
      # 10 - Gradle
      # =========================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'
          validate-wrappers: false

      # =========================================================
      # 11 - Language list
      # =========================================================
      - name: Generate language list
        working-directory: source
        run: |
          chmod +x scripts/languagelist_updater.sh
          bash scripts/languagelist_updater.sh

      # =========================================================
      # 12 - LWJGL
      # =========================================================
      - name: Build LWJGL
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew :jre_lwjgl3glfw:build --no-daemon

      # =========================================================
      # 13 - Launcher APK
      # =========================================================
      - name: Build Ayran Launcher APK
        working-directory: source
        run: |
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon

      # =========================================================
      # 14 - APK'yı hazırla
      # =========================================================
      - name: Prepare APK
        run: |
          mkdir -p output

          APK=$(find \
            source/app_pojavlauncher/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "HATA: APK bulunamadı!"
            find source/app_pojavlauncher/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK bulundu:"
          echo "$APK"

          cp "$APK" output/Ayran-Launcher-debug.apk

          ls -lh output/Ayran-Launcher-debug.apk

      # =========================================================
      # 15 - APK'yı Actions'a yükle
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AyranLauncher-APK
          path: output/Ayran-Launcher-debug.apk
          if-no-files-found: error
